services:
  broker:
    build: ./services/broker
    container_name: crashlab-broker
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT:-}
      - SECRET_MARKERS=${SECRET_MARKERS:-}
      - AUDIT_LOG_PATH=/logs/audit.log
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:?set AUDIT_HMAC_KEY in .env}
      - RED_TEAM_TOKEN=${RED_TEAM_TOKEN:?set RED_TEAM_TOKEN in .env}
      - BLUE_TEAM_TOKEN=${BLUE_TEAM_TOKEN:?set BLUE_TEAM_TOKEN in .env}
      - AUDIT_TOKEN=${AUDIT_TOKEN:?set AUDIT_TOKEN in .env}
      - VIEWER_TOKEN=${VIEWER_TOKEN:-} # optional public role: read the record, and start a rate-limited run of the current model
      - VIEWER_CAN_RUN=${VIEWER_CAN_RUN:-1}
      - DASHBOARD_URL=${DASHBOARD_URL:-https://crashlab-byteforce.vercel.app}
      - VIEWER_RUN_COOLDOWN_SEC=${VIEWER_RUN_COOLDOWN_SEC:-90}
      - VIEWER_RUNS_PER_IP_DAY=${VIEWER_RUNS_PER_IP_DAY:-6}
      - VIEWER_RUNS_PER_DAY=${VIEWER_RUNS_PER_DAY:-40}
    volumes:
      - ./logs:/logs
    networks:
      - red-net
      - blue-net
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets LLM_BASE_URL point at a local Ollama
    ports:
      - "127.0.0.1:4000:4000" # host-only (loopback), for the demo dashboard/verify script — not reachable from outside this machine
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: false # needs to write /logs; everything else is read-only via the image layers
    restart: unless-stopped

  red-team:
    build: ./services/red-team
    container_name: crashlab-red-team
    restart: unless-stopped
    environment:
      - BROKER_URL=http://broker:4000
      - RED_TEAM_TOKEN=${RED_TEAM_TOKEN:?set RED_TEAM_TOKEN in .env} # this container never sees BLUE_TEAM_TOKEN or AUDIT_TOKEN
    networks:
      - red-net # cannot reach blue-team: no shared network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    depends_on:
      - broker

  blue-team:
    build: ./services/blue-team
    container_name: crashlab-blue-team
    restart: unless-stopped
    environment:
      - BROKER_URL=http://broker:4000
      - BLUE_TEAM_TOKEN=${BLUE_TEAM_TOKEN:?set BLUE_TEAM_TOKEN in .env} # this container never sees RED_TEAM_TOKEN or AUDIT_TOKEN
      # The blind judge model. Use a different model from the one under test.
      # Only the model's reply is ever sent to it, never the attack prompt.
      - JUDGE_BASE_URL=${JUDGE_BASE_URL:-}
      - JUDGE_API_KEY=${JUDGE_API_KEY:-}
      - JUDGE_MODEL=${JUDGE_MODEL:-}
    networks:
      - blue-net # cannot reach red-team: no shared network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    depends_on:
      - broker

networks:
  red-net:
    driver: bridge
    internal: true # the attacker has no route to the internet: it can only talk to the broker
  blue-net:
    driver: bridge # the judge needs egress to call its own model; it still cannot reach red-net
